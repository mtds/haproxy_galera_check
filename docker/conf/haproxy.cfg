global
    maxconn 2000

defaults
    mode tcp
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout check   5s

listen galera
    bind *:3306
    balance roundrobin
    # Parse the HTTP status line produced by clusterchk on port 9999:
    # 200 keeps the node UP, 503 drains it. Intervals shortened
    # compared to production so that failover is visible quickly.
    option httpchk
    server galera1 galera1:3306 check port 9999 inter 3000 rise 2 fall 2
    server galera2 galera2:3306 check port 9999 inter 3000 rise 2 fall 2
    server galera3 galera3:3306 check port 9999 inter 3000 rise 2 fall 2
